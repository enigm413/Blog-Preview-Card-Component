<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="blog-preview-card">
      <div class="blog-preview-card-img-wrapper">
        <img
          src="Images/illustration-article.svg"
          alt="Card Illustration Image"
          class="blog-preview-card-img"
        />
      </div>

      <div class="blog-preview-card-txt-wrapper">
        <p class="tag">Learning</p>
        <p class="date">Published 21 Dec 2023</p>
        <h2 class="blog-preview-card-title">HTML & CSS foundations</h2>
        <p class="blog-preview-card-text">
          These languages are the backbone of every website, defining structure,
          content and presentation
        </p>

        <div class="author-wrapper">
          <img
            src="Images/image-avatar.webp"
            alt="Greg Hooper"
            class="author-img"
          />
          <p class="author-name">Greg Hooper</p>
        </div>
      </div>
    </article>
  </body>
</html>
